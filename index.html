<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atara — live buses in Tirana</title>
<meta name="description" content="Atara shows you where the buses are in Tirana right now, and tells you which one to take to get where you are going.">
<meta name="theme-color" content="#061a2f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230047DE'/><rect x='6' y='9' width='20' height='14' rx='3' fill='white'/><rect x='9' y='12' width='14' height='5' rx='1' fill='%230047DE'/><circle cx='11' cy='25' r='2.4' fill='white'/><circle cx='21' cy='25' r='2.4' fill='white'/></svg>">
<link rel="preconnect" href="https://tile.openstreetmap.org">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">

<header class="app-top">
  <a class="wordmark" href="./" aria-label="Atara home">ATARA</a>
  <div class="app-top-right">
    <span class="live-pill" id="livePill"><span class="live-dot"></span>Connecting</span>
    <a class="ghost-link" href="how-it-works.html">How it works</a>
  </div>
</header>

<div class="banner" id="feedBanner" hidden></div>

<main class="app-main">

  <!-- One question. Everything else happens after this is answered. -->
  <section class="ask" id="ask" aria-labelledby="askH">
    <h1 id="askH">Where are you going?</h1>

    <div class="ask-fields">
      <div class="ask-field">
        <label for="originInput">From</label>
        <input id="originInput" type="text" autocomplete="off" spellcheck="false"
               placeholder="Your location, a stop or a place">
        <button type="button" class="link-btn" id="useLocation">Use my location</button>
      </div>
      <div class="ask-field">
        <label for="destInput">To</label>
        <input id="destInput" type="text" autocomplete="off" spellcheck="false"
               placeholder="Where do you want to go?">
      </div>
    </div>

    <p class="ask-hint" id="askHint">Search a destination, or tap the map to set where you are.</p>

    <ul class="suggest" id="suggest" role="listbox" aria-label="Search results" hidden></ul>
  </section>

  <!-- The journey. Steps are listed so the whole plan is visible, but only the
       next one is ever highlighted. -->
  <section class="plan" id="plan" hidden aria-live="polite">
    <div class="plan-head">
      <div>
        <p class="plan-total" id="planTotal"></p>
        <p class="plan-sub" id="planSub"></p>
      </div>
      <button type="button" class="btn ghost" id="clearPlan">Change destination</button>
    </div>
    <ol class="steps" id="steps"></ol>
    <p class="plan-note" id="planNote"></p>
    <button type="button" class="btn primary big" id="startJourney">Start journey</button>
  </section>

  <!-- Guidance. One instruction, large, with the direction to follow. -->
  <section class="guide" id="guide" hidden aria-live="assertive">
    <div class="guide-card">
      <div class="guide-top">
        <span class="guide-step" id="guideStep"></span>
        <button type="button" class="guide-exit" id="stopGuide">End</button>
      </div>
      <div class="guide-body">
        <div class="guide-arrow" id="guideArrow" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="40" height="40"><path d="M20 3 L32 34 L20 27 L8 34 Z" fill="currentColor"/></svg>
        </div>
        <div class="guide-text">
          <p class="guide-lead" id="guideLead"></p>
          <p class="guide-sub" id="guideSub"></p>
        </div>
        <div class="guide-dist"><span id="guideDist"></span></div>
      </div>
      <div class="guide-actions">
        <button type="button" class="btn ghost" id="recenter">I am here now</button>
      </div>
    </div>
  </section>

  <div class="map-wrap" id="mapWrap">
    <div id="map" role="application" aria-label="Map of buses in Tirana"></div>
    <div class="map-legend" id="mapLegend" hidden></div>
    <button type="button" class="map-locate" id="mapLocate" aria-label="Centre on my location">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke-linecap="round"/></svg>
    </button>
  </div>

</main>

<footer class="app-foot">
  <p>Live positions from the vehicle systems serving Tirana, shown as one network.
     Arrival times are estimates from distance and current speed. Map data by OpenStreetMap contributors.</p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="js/main.js"></script>
<script src="js/app-core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
